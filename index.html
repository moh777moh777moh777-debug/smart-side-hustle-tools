<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Word Counter - Smart Side Hustle</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 30px auto;
    padding: 20px;
    background: #f5f5f5;
}

.container {
    background: white;
    padding: 25px;
    border-radius: 12px;
}

h1 {
    margin-bottom: 10px;
}

textarea {
    width: 100%;
    min-height: 250px;
    padding: 15px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
    resize: vertical;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.stat {
    background: #f1f1f1;
    padding: 15px;
    border-radius: 8px;
}

.number {
    font-size: 24px;
    font-weight: bold;
}

button {
    margin-top: 15px;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="container">

<h1>Free Word Counter</h1>

<p>
Count words, characters, sentences, and paragraphs instantly.
</p>

<textarea id="text" placeholder="Paste or type your text here..."></textarea>

<div class="stats">

<div class="stat">
Words
<div class="number" id="words">0</div>
</div>

<div class="stat">
Characters
<div class="number" id="characters">0</div>
</div>

<div class="stat">
Sentences
<div class="number" id="sentences">0</div>
</div>

<div class="stat">
Paragraphs
<div class="number" id="paragraphs">0</div>
</div>

</div>

<button onclick="clearText()">Clear</button>

</div>

<script>

const textInput = document.getElementById("text");

textInput.addEventListener("input", calculate);

function calculate() {

    const text = textInput.value;

    const words = text.trim()
        ? text.trim().split(/\s+/).length
        : 0;

    const characters = text.length;

    const sentences = text.trim()
        ? text.split(/[.!?]+/)
            .filter(sentence => sentence.trim().length > 0)
            .length
        : 0;

    const paragraphs = text.trim()
        ? text.split(/\n\s*\n/)
            .filter(paragraph => paragraph.trim().length > 0)
            .length
        : 0;

    document.getElementById("words").textContent = words;
    document.getElementById("characters").textContent = characters;
    document.getElementById("sentences").textContent = sentences;
    document.getElementById("paragraphs").textContent = paragraphs;
}

function clearText() {
    textInput.value = "";
    calculate();
}

</script>

</body>
</html>
